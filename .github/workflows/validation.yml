name: TradeBot Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Automation governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate skills and workflow guardrails
        run: python3 scripts/validate_automation.py

      - name: Validate shell syntax
        run: bash -n scripts/*.sh .githooks/pre-push

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRADEBOT_BUILD_JOBS: "2"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure, build, and test
        run: ./scripts/ci_validate.sh build/ci-validation

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-validation/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-validation/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize offline boundary
        if: always()
        run: |
          {
            echo "### TradeBot default validation"
            echo "- Provider proof targets: disabled"
            echo "- Credentials and repository secrets: unused"
            echo "- CTest execution: sequential"
            echo "- This result does not authorize release, deployment, orders, or live trading."
          } >> "$GITHUB_STEP_SUMMARY"
