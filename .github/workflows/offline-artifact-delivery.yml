name: TradeBot Offline Artifact Delivery

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA, tag, or reviewed branch to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: offline-artifact-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  deliver-candidate:
    name: Verify and deliver non-executable evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRADEBOT_BUILD_JOBS: "2"
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record exact revision
        id: identity
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Configure, build, and run full offline tests
        run: ./scripts/ci_validate.sh build/artifact-validation

      - name: Package exact-commit validation evidence
        run: ./scripts/package_offline_artifact.sh build/artifact-validation "$RUNNER_TEMP/tradebot-offline-artifact"

      - name: Verify package checksums
        working-directory: ${{ runner.temp }}/tradebot-offline-artifact
        run: |
          expected_entries=$'CTEST_RESULTS.log\nLICENSE\nMANIFEST.txt\nSHA256SUMS'
          actual_entries="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_entries" = "$expected_entries"
          test ! -e tradebot_core
          grep -Fqx 'artifact_class=offline_validation_evidence' MANIFEST.txt
          grep -Fqx 'packaged_executable=false' MANIFEST.txt
          grep -Fqx 'release_authorized=false' MANIFEST.txt
          grep -Fqx 'deployment_authorized=false' MANIFEST.txt
          grep -Fqx 'live_trading_authorized=false' MANIFEST.txt
          sha256sum --check SHA256SUMS

      - name: Upload ephemeral validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tradebot-offline-evidence-${{ steps.identity.outputs.short_sha }}
          path: ${{ runner.temp }}/tradebot-offline-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Summarize candidate identity and limits
        run: |
          {
            echo "### TradeBot offline validation evidence"
            echo "- Commit: \`${{ steps.identity.outputs.commit_sha }}\`"
            echo "- Gate 6 and Gate 7 targets: disabled"
            echo "- Full default CTest suite: passed sequentially"
            echo "- Executable included: no (hash evidence only)"
            echo "- Retention: 14 days"
            echo "- This upload is not a GitHub Release or deployment and does not authorize provider traffic, orders, or live trading."
          } >> "$GITHUB_STEP_SUMMARY"
