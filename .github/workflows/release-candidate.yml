name: Offline Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build verified offline artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce offline policy
        run: bash scripts/ci_policy_checks.sh

      - name: Configure release build
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release

      - name: Build core
        run: cmake --build build/release --target tradebot_core --parallel 2

      - name: Run complete default test suite
        run: |
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure

      - name: Assemble candidate
        run: |
          install -d dist
          install -m 0755 build/release/tradebot_core dist/tradebot_core
          (
            cd dist
            sha256sum tradebot_core > SHA256SUMS
          )
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_OS"
            printf 'compiler=%s\n' "$(c++ --version | sed -n '1p')"
            printf 'cmake=%s\n' "$(cmake --version | sed -n '1p')"
            printf 'provider_proofs=disabled\n'
            printf 'deployment=not_performed\n'
          } > dist/BUILD-METADATA.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: tradebot-offline-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
