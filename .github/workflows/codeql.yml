name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: C++ security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build default-off core
        run: |
          engine_root="."
          if [[ -f engine/CMakeLists.txt ]]; then engine_root="engine"; fi
          cmake -S "$engine_root" -B "$engine_root/build/codeql" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTRADEBOT_ENABLE_LIVE_RUNTIME=OFF \
            -DTRADEBOT_ENABLE_CTRADER_GATE6=OFF \
            -DTRADEBOT_ENABLE_CTRADER_GATE7=OFF
          cmake --build "$engine_root/build/codeql" --parallel 2

      - name: Analyze
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: "/language:c-cpp"
